<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Backwards</title>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2EEFF;--ink:#1B1535;--card:#FFFFFF;--line:#D6CCFF;--hot:#6C4BFF;--on-hot:#FFFFFF;--pop:#FFD21F;--bad:#C62E4A;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1B1535;--ink:#F5F1FF;--card:#2A2150;--line:#43387A;--hot:#8E75FF;--on-hot:#150F33;--bad:#FF7A93}}
:root[data-theme="dark"]{--bg:#1B1535;--ink:#F5F1FF;--card:#2A2150;--line:#43387A;--hot:#8E75FF;--on-hot:#150F33;--bad:#FF7A93}
html{background:var(--bg)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;font-size:17px;line-height:1.4}
#app{max-width:480px;margin:0 auto;padding:20px 20px 40px}
.t{font-family:"Bagel Fat One","DM Sans",system-ui,sans-serif;font-weight:400;font-size:clamp(48px,15vw,72px);line-height:1;margin:20px 0 8px}
.t span{display:inline-block;animation:flip .9s .15s cubic-bezier(.3,1.4,.5,1) both}
@keyframes flip{from{transform:scaleX(-1)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){.t span{animation:none}}
.sub{margin:0 0 20px}
.step{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px;margin:0 0 12px;display:flex;gap:14px;align-items:center}
.n{font-family:"Bagel Fat One",sans-serif;font-size:34px;width:34px;text-align:center;flex:none}
.btn{flex:1;font:700 18px "DM Sans",system-ui,sans-serif;border:0;border-radius:14px;padding:16px 10px;background:var(--hot);color:var(--on-hot);cursor:pointer}
.btn.rec{background:var(--bad);color:#fff}
.btn.rec.on{outline:4px solid var(--pop);outline-offset:3px}
.btn:disabled{opacity:.35;cursor:default}
.btn:focus-visible,.link:focus-visible{outline:3px solid var(--pop);outline-offset:2px}
.link{background:none;border:0;color:var(--ink);font:600 16px "DM Sans",sans-serif;padding:8px 0;cursor:pointer;text-decoration:underline}
.msg{min-height:24px;font-weight:600;margin:4px 0 8px}
.err{color:var(--bad)}
</style>
</head>
<body>
<div id="app">
  <h1 class="t"><span>Backwards</span></h1>
  <p class="sub">Sing 5 to 10 seconds. Hear it flipped. Sing the flipped sound back.</p>
  <div class="step"><div class="n">1</div><button class="btn rec" id="r1">Record my singing</button></div>
  <div class="step"><div class="n">2</div><button class="btn" id="p1" disabled>Play it backwards</button></div>
  <div class="step"><div class="n">3</div><button class="btn rec" id="r2" disabled>Record the backwards sound</button></div>
  <div class="step"><div class="n">4</div><button class="btn" id="p2" disabled>Play my attempt flipped</button></div>
  <p class="msg" id="msg"></p>
  <button class="link" id="orig" hidden>Play my original singing</button><br>
  <button class="link" id="reset">Start over</button>
</div>
<script>
const AC = window.AudioContext || window.webkitAudioContext;
let ctx, cur, tick, S = {};
const $ = s => document.querySelector(s);
const msg = (t, bad) => { const m = $('#msg'); m.textContent = t || ''; m.className = 'msg' + (bad ? ' err' : ''); };

function stopPlay(){ try{ cur && cur.stop(); }catch(e){} cur = null; }
function play(b){
  stopPlay(); ctx.resume();
  const s = ctx.createBufferSource();
  s.buffer = b; s.connect(ctx.destination); s.start(); cur = s;
}
function rev(b){
  const o = ctx.createBuffer(b.numberOfChannels, b.length, b.sampleRate);
  for(let c=0;c<b.numberOfChannels;c++) o.getChannelData(c).set(b.getChannelData(c).slice().reverse());
  return o;
}
async function startRec(){
  ctx = ctx || new AC();
  stopPlay();
  const s = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false}});
  const mr = new MediaRecorder(s), ch = [];
  mr.ondataavailable = e => ch.push(e.data);
  const done = new Promise(r => mr.onstop = async () => {
    s.getTracks().forEach(t => t.stop());
    const ab = await new Blob(ch,{type:mr.mimeType}).arrayBuffer();
    r(await ctx.decodeAudioData(ab));
  });
  mr.start();
  return {stop:()=>mr.stop(), done};
}
function wire(id, label, cb){
  const b = $('#'+id); let r = null, t0 = 0;
  b.onclick = async () => {
    if(!r){
      try{
        r = await startRec(); t0 = Date.now(); b.classList.add('on'); b.textContent = 'Tap to stop';
        tick = setInterval(() => { const s = Math.floor((Date.now()-t0)/1000); msg('Recording… ' + s + 's'); if(s>=30) b.click(); }, 250);
      }catch(e){ msg('Microphone blocked. Allow mic access in your browser settings for this site.', true); }
    } else {
      clearInterval(tick); const x = r; r = null;
      b.disabled = true; b.classList.remove('on'); b.textContent = 'Flipping…'; msg('');
      x.stop();
      try{ const buf = await x.done; b.textContent = label; b.disabled = false; cb(buf); }
      catch(e){ b.textContent = label; b.disabled = false; msg('That recording could not be read. Try again.', true); }
    }
  };
}
wire('r1','Record my singing', b => {
  S = {o:b, f:rev(b)};
  $('#p1').disabled = false; $('#r2').disabled = false; $('#p2').disabled = true; $('#orig').hidden = false;
  msg('Tap 2 to hear it backwards.');
});
wire('r2','Record the backwards sound', b => {
  S.a = rev(b); $('#p2').disabled = false; msg('Tap 4 to hear your attempt flipped.');
});
$('#p1').onclick = () => play(S.f);
$('#p2').onclick = () => play(S.a);
$('#orig').onclick = () => play(S.o);
$('#reset').onclick = () => {
  stopPlay(); S = {}; msg('');
  $('#p1').disabled = true; $('#r2').disabled = true; $('#p2').disabled = true; $('#orig').hidden = true;
};
</script>
</body>
</html>
